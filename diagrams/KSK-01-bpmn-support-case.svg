dle" fill="#444">да</text><polyline points="1588,629.0 1588,118.0 1701,118.0" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arr)"/><polyline points="1588,493.0 1588,118.0 1701,118.0" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arr)"/><line x1="1835" y1="118.0" x2="1932" y2="118.0" stroke="#333" stroke-width="1.2" marker-end="url(#arr)"/><text x="28.0" y="761.5" font-family="Arial" font-size="10" text-anchor="start" fill="#555">Оператор не инициирует повторную оплату или возврат только по несогласованности экранов. Скриншот клиента не заменяет подтверждение платёжного состояния системой (KSK-BR-03).</text></svg>