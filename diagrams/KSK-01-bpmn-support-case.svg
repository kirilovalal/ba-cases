<svg xmlns="http://www.w3.org/2000/svg" width="2120" height="810" viewBox="0 0 2120 810"><defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#333"/></marker></defs><rect width="2120" height="810" fill="#ffffff"/><text x="20" y="28" font-family="Arial" font-size="16" font-weight="bold" fill="#1F3A5F">KioskCare — BPMN: обращение «оплата подтверждена, заказ не отображается»</text><rect x="20" y="50" width="2080" height="680" rx="0" fill="#fff" stroke="#1F3A5F" stroke-width="1.2"/><rect x="20" y="50" width="2080" height="136" rx="0" fill="#F7F9FC" stroke="#1F3A5F" stroke-width="1.2"/><rect x="20" y="50" width="28" height="136" rx="0" fill="#E3EAF4" stroke="#1F3A5F" stroke-width="1.2"/><text transform="translate(38,118.0) rotate(-90)" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#1F3A5F">Клиент</text><rect x="20" y="186" width="2080" height="136" rx="0" fill="#F7F9FC" stroke="#1F3A5F" stroke-width="1.2"/><rect x="20" y="186" width="28" height="136" rx="0" fill="#E3EAF4" stroke="#1F3A5F" stroke-width="1.2"/><text transform="translate(38,254.0) rotate(-90)" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#1F3A5F">Оператор поддержки</text><rect x="20" y="322" width="2080" height="136" rx="0" fill="#F7F9FC" stroke="#1F3A5F" stroke-width="1.2"/><rect x="20" y="322" width="28" height="136" rx="0" fill="#E3EAF4" stroke="#1F3A5F" stroke-width="1.2"/><text transform="translate(38,390.0) rotate(-90)" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#1F3A5F">Платёжный сервис</text><rect x="20" y="458" width="2080" height="136" rx="0" fill="#F7F9FC" stroke="#1F3A5F" stroke-width="1.2"/><rect x="20" y="458" width="28" height="136" rx="0" fill="#E3EAF4" stroke="#1F3A5F" stroke-width="1.2"/><text transform="translate(38,526.0) rotate(-90)" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#1F3A5F">Система заказов</text><rect x="20" y="594" width="2080" height="136" rx="0" fill="#F7F9FC" stroke="#1F3A5F" stroke-width="1.2"/><rect x="20" y="594" width="28" height="136" rx="0" fill="#E3EAF4" stroke="#1F3A5F" stroke-width="1.2"/><text transform="translate(38,662.0) rotate(-90)" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#1F3A5F">Уполномоченная команда</text><circle cx="148" cy="118.0" r="16" fill="#E6F4EA" stroke="#2E7D32" stroke-width="1.5"/><rect x="261.0" y="85.0" width="134" height="66" rx="6" fill="#EAF2FB" stroke="#1F3A5F" stroke-width="1.2"/><text x="328.0" y="115.0" font-family="Arial" font-size="10" text-anchor="middle" fill="#111">Жалоба: списание</text><text x="328.0" y="128.0" font-family="Arial" font-size="10" text-anchor="middle" fill="#111">есть, заказа нет</text><rect x="441.0" y="221.0" width="134" height="66" rx="6" fill="#EAF2FB" stroke="#1F3A5F" stroke-width="1.2"/><text x="508.0" y="244.5" font-family="Arial" font-size="10" text-anchor="middle" fill="#111">Найти обращение,</text><text x="508.0" y="257.5" font-family="Arial" font-size="10" text-anchor="middle" fill="#111">payment_id /</text><text x="508.0" y="270.5" font-family="Arial" font-size="10" text-anchor="middle" fill="#111">order_id</text><rect x="621.0" y="357.0" width="134" height="66" rx="6" fill="#F3F0FF" stroke="#5B4B9E" stroke-width="1.2"/><text x="688.0" y="387.0" font-family="Arial" font-size="10" text-anchor="middle" fill="#111">Статус платежа +</text><text x="688.0" y="400.0" font-family="Arial" font-size="10" text-anchor="middle" fill="#111">время проверки</text><rect x="621.0" y="493.0" width="134" height="66" rx="6" fill="#F3F0FF" stroke="#5B4B9E" stroke-width="1.2"/><text x="688.0" y="523.0" font-family="Arial" font-size="10" text-anchor="middle" fill="#111">Статус заказа +</text><text x="688.0" y="536.0" font-family="Arial" font-size="10" text-anchor="middle" fill="#111">время проверки</text><polygon points="868,230.0 892,254.0 868,278.0 844,254.0" fill="#FFF4D6" stroke="#B7791F" stroke-width="1.2"/><text x="868.0" y="215.0" font-family="Arial" font-size="10" text-anchor="middle" fill="#111">Статус оплаты</text><text x="868.0" y="228.0" font-family="Arial" font-size="10" text-anchor="middle" fill="#111">известен?</text><rect x="981.0" y="221.0" width="134" height="66" rx="6" fill="#EAF2FB" stroke="#1F3A5F" stroke-width="1.2"/><text x="1048.0" y="231.5" font-family="Arial" font-size="10" text-anchor="middle" fill="#111">«Неизвестно»:</text><text x="1048.0" y="244.5" font-family="Arial" font-size="10" text-anchor="middle" fill="#111">сверка у</text><text x="1048.0" y="257.5" font-family="Arial" font-size="10" text-anchor="middle" fill="#111">владельца</text><text x="1048.0" y="270.5" font-family="Arial" font-size="10" text-anchor="middle" fill="#111">интеграции (KSK-</text><text x="1048.0" y="283.5" font-family="Arial" font-size="10" text-anchor="middle" fill="#111">BR-02)</text><polygon points="1228,230.0 1252,254.0 1228,278.0 1204,254.0" fill="#FFF4D6" stroke="#B7791F" stroke-width="1.2"/><text x="1228.0" y="221.5" font-family="Arial" font-size="10" text-anchor="middle" fill="#111">Оплата подтверждена?</text><polygon points="1408,230.0 1432,254.0 1408,278.0 1384,254.0" fill="#FFF4D6" stroke="#B7791F" stroke-width="1.2"/><text x="1408.0" y="221.5" font-family="Arial" font-size="10" text-anchor="middle" fill="#111">Заказ найден?</text><rect x="1521.0" y="629.0" width="134" height="66" rx="6" fill="#EAF2FB" stroke="#1F3A5F" stroke-width="1.2"/><text x="1588.0" y="639.5" font-family="Arial" font-size="10" text-anchor="middle" fill="#111">Проверить связь</text><text x="1588.0" y="652.5" font-family="Arial" font-size="10" text-anchor="middle" fill="#111">платёж–заказ;</text><text x="1588.0" y="665.5" font-family="Arial" font-size="10" text-anchor="middle" fill="#111">возврат только</text><text x="1588.0" y="678.5" font-family="Arial" font-size="10" text-anchor="middle" fill="#111">по инструкции</text><text x="1588.0" y="691.5" font-family="Arial" font-size="10" text-anchor="middle" fill="#111">(KSK-BR-04, 05)</text><rect x="1521.0" y="493.0" width="134" height="66" rx="6" fill="#F3F0FF" stroke="#5B4B9E" stroke-width="1.2"/><text x="1588.0" y="510.0" font-family="Arial" font-size="10" text-anchor="middle" fill="#111">Проверить</text><text x="1588.0" y="523.0" font-family="Arial" font-size="10" text-anchor="middle" fill="#111">актуальность и</text><text x="1588.0" y="536.0" font-family="Arial" font-size="10" text-anchor="middle" fill="#111">отображение</text><text x="1588.0" y="549.0" font-family="Arial" font-size="10" text-anchor="middle" fill="#111">заказа</text><rect x="1701.0" y="85.0" width="134" height="66" rx="6" fill="#EAF2FB" stroke="#1F3A5F" stroke-width="1.2"/><text x="1768.0" y="102.0" font-family="Arial" font-size="10" text-anchor="middle" fill="#111">Получить</text><text x="1768.0" y="115.0" font-family="Arial" font-size="10" text-anchor="middle" fill="#111">подтверждённый</text><text x="1768.0" y="128.0" font-family="Arial" font-size="10" text-anchor="middle" fill="#111">статус и</text><text x="1768.0" y="141.0" font-family="Arial" font-size="10" text-anchor="middle" fill="#111">следующий шаг</text><circle cx="1948" cy="118.0" r="16" fill="#FDECEA" stroke="#C62828" stroke-width="3"/><line x1="164" y1="118.0" x2="261" y2="118.0" stroke="#333" stroke-width="1.2" marker-end="url(#arr)"/><polyline points="328,151.0 328,254.0 441,254.0" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arr)"/><polyline points="508,287.0 508,390.0 621,390.0" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arr)"/><polyline points="508,287.0 508,526.0 621,526.0" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arr)"/><polyline points="688,357.0 688,254.0 844,254.0" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arr)"/><polyline points="688,493.0 688,254.0 844,254.0" fill="none" stroke="#333" stroke-wid