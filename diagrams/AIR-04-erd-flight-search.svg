rt" fill="#111">vendor_field</text><text x="338.0" y="480.0" font-family="Arial" font-size="10" text-anchor="start" fill="#111">transform: UTC → местная</text><text x="338.0" y="493.0" font-family="Arial" font-size="10" text-anchor="start" fill="#111">дата</text><text x="338.0" y="506.0" font-family="Arial" font-size="10" text-anchor="start" fill="#111">note: фиксируется в</text><text x="338.0" y="519.0" font-family="Arial" font-size="10" text-anchor="start" fill="#111">контракте интеграции</text><line x1="285" y1="110" x2="330" y2="110" stroke="#333" stroke-width="1.2" marker-end="url(#arr)"/><rect x="291.7" y="96.0" width="31.6" height="14" fill="#fff" opacity="0.9"/><text x="307.5" y="107.0" font-family="Arial" font-size="10" text-anchor="middle" fill="#444">0..n</text><polyline points="172.5,70 172.5,52 712.5,52 712.5,70" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arr)"/><rect x="426.7" y="38" width="31.6" height="14" fill="#fff" opacity="0.9"/><text x="442.5" y="49.0" font-family="Arial" font-size="10" text-anchor="middle" fill="#444">0..1</text><line x1="555" y1="110" x2="600" y2="110" stroke="#333" stroke-width="1.2" marker-end="url(#arr)"/><rect x="571.3" y="96.0" width="12.4" height="14" fill="#fff" opacity="0.9"/><text x="577.5" y="107.0" font-family="Arial" font-size="10" text-anchor="middle" fill="#444">1</text><text x="28.0" y="729.0" font-family="Arial" font-size="10" text-anchor="start" fill="#555">departure_timezone нужен, чтобы трактовать дату как местную (AIR-BR-01). Если поставщик его не отдаёт,</text><text x="28.0" y="742.0" font-family="Arial" font-size="10" text-anchor="start" fill="#555">правило поиска пересматривается, а не угадывается.</text></svg>