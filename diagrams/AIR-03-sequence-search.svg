<svg xmlns="http://www.w3.org/2000/svg" width="840" height="978" viewBox="0 0 840 978"><defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#333"/></marker></defs><rect width="840" height="978" fill="#ffffff"/><text x="20" y="28" font-family="Arial" font-size="16" font-weight="bold" fill="#1F3A5F">AirTrack Companion — последовательность поиска и поздний ответ</text><rect x="70" y="50" width="120" height="36" rx="4" fill="#EAF2FB" stroke="#1F3A5F" stroke-width="1.2"/><text x="130.0" y="71.8" font-family="Arial" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">Пользователь</text><line x1="130" y1="86" x2="130" y2="888" stroke="#999" stroke-width="1.2" stroke-dasharray="6,4"/><rect x="270" y="50" width="120" height="36" rx="4" fill="#EAF2FB" stroke="#1F3A5F" stroke-width="1.2"/><text x="330.0" y="71.8" font-family="Arial" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">Приложение</text><line x1="330" y1="86" x2="330" y2="888" stroke="#999" stroke-width="1.2" stroke-dasharray="6,4"/><rect x="470" y="50" width="120" height="36" rx="4" fill="#EAF2FB" stroke="#1F3A5F" stroke-width="1.2"/><text x="530.0" y="71.8" font-family="Arial" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">Сервер</text><line x1="530" y1="86" x2="530" y2="888" stroke="#999" stroke-width="1.2" stroke-dasharray="6,4"/><rect x="670" y="50" width="120" height="36" rx="4" fill="#EAF2FB" stroke="#1F3A5F" stroke-width="1.2"/><text x="730.0" y="71.8" font-family="Arial" font-size="11" text-anchor="middle" fill="#111" font-weight="bold">Поставщик</text><line x1="730" y1="86" x2="730" y2="888" stroke="#999" stroke-width="1.2" stroke-dasharray="6,4"/><line x1="130" y1="110" x2="330" y2="110" stroke="#333" stroke-width="1.2" marker-end="url(#arr)"/><rect x="169.4" y="96.0" width="121.2" height="14" fill="#fff" opacity="0.9"/><text x="230.0" y="107.0" font-family="Arial" font-size="10" text-anchor="middle" fill="#444">Номер рейса + дата</text><line x1="330" y1="154" x2="530" y2="154" stroke="#333" stroke-width="1.2" marker-end="url(#arr)"/><rect x="321.4" y="140.0" width="217.20000000000002" height="14" fill="#fff" opacity="0.9"/><text x="430.0" y="151.0" font-family="Arial" font-size="10" text-anchor="middle" fill="#444">search(id=A, номер, местная дата)</text><line x1="530" y1="198" x2="730" y2="198" stroke="#333" stroke-width="1.2" marker-end="url(#arr)"/><rect x="572.6" y="184.0" width="114.80000000000001" height="14" fill="#fff" opacity="0.9"/><text x="630.0" y="195.0" font-family="Arial" font-size="10" text-anchor="middle" fill="#444">Кандидаты на дату</text><line x1="130" y1="242" x2="330" y2="242" stroke="#333" stroke-width="1.2" marker-end="url(#arr)"/><rect x="156.6" y="228.0" width="146.8" height="14" fill="#fff" opacity="0.9"/><text x="230.0" y="239.0" font-family="Arial" font-size="10" text-anchor="middle" fill="#444">Изменил дату до ответа</text><line x1="330" y1="286" x2="530" y2="286" stroke="#333" stroke-width="1.2" marker-end="url(#arr)"/><rect x="388.6" y="272.0" width="82.80000000000001" height="14" fill="#fff" opacity="0.9"/><text x="430.0" y="283.0" font-family="Arial" font-size="10" text-anchor="middle" fill="#444">search(id=B)</text><line x1="530" y1="330" x2="730" y2="330" stroke="#333" stroke-width="1.2" marker-end="url(#arr)"/><rect x="553.4" y="316.0" width="153.20000000000002" height="14" fill="#fff" opacity="0.9"/><text x="630.0" y="327.0" font-family="Arial" font-size="10" text-anchor="middle" fill="#444">Кандидаты на новую дату</text><line x1="730" y1="400" x2="530" y2="400" stroke="#333" stroke-width="1.2" stroke-dasharray="6,4" marker-end="url(#arr)"/><rect x="601.4" y="386.0" width="57.2" height="14" fill="#fff" opacity="0.9"/><text x="630.0" y="397.0" font-family="Arial" font-size="10" text-anchor="middle" fill="#444">Данные B</text><line x1="530" y1="444" x2="330" y2="444" stroke="#333" stroke-width="1.2" stroke-dasharray="6,4" marker-end="url(#arr)"/><rect x="379.0" y="430.0" width="102.0" height="14" fill="#fff" opacity="0.9"/><text x="430.0" y="441.0" font-family="Arial" font-size="10" text-anchor="middle" fill="#444">Результат, id=B</text><line x1="330" y1="488" x2="130" y2="488" stroke="#333" stroke-width="1.2" stroke-dasharray="6,4" marker-end="url(#arr)"/><rect x="156.6" y="474.0" width="146.8" height="14" fill="#fff" opacity="0.9"/><text x="230.0" y="485.0" font-family="Arial" font-size="10" text-anchor="middle" fill="#444">Список / карточка по B</text><line x1="730" y1="558" x2="530" y2="558" stroke="#333" stroke-width="1.2" stroke-dasharray="6,4" marker-end="url(#arr)"/><rect x="601.4" y="544.0" width="57.2" height="14" fill="#fff" opacity="0.9"/><text x="630.0" y="555.0" font-family="Arial" font-size="10" text-anchor="middle" fill="#444">Данные A</text><line x1="530" y1="602" x2="330" y2="602" stroke="#333" stroke-width="1.2" stroke-dasharray="6,4" marker-end="url(#arr)"/><rect x="379.0" y="588.0" width="102.0" height="14" fill="#fff" opacity="0.9"/><text x="430.0" y="599.0" font-family="Arial" font-size="10" text-anchor="middle" fill="#444">Результат, id=A</text><polyline points="330,646 370,646 370,664 335,664" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arr)"/><text x="378.0" y="649.0" font-family="Arial" font-size="10" text-anchor="start" fill="#111">id ≠ текущему → выдача не</text><text x="378.0" y="662.0" font-family="Arial" font-size="10" text-anchor="start" fill="#111">меняется (AIR-BR-03)</text><line x1="730" y1="716" x2="530" y2="716" stroke="#333" stroke-width="1.2" stroke-dasharray="6,4" marker-end="url(#arr)"/><rect x="566.2" y="702.0" width="127.60000000000001" height="14" fill="#fff" opacity="0.9"/><text x="630.0" y="713.0" font-family="Arial" font-size="10" text-anchor="middle" fill="#444">Ошибка / нет ответа</text><line x1="530" y1="760" x2="330" y2="760" stroke="#333" stroke-width="1.2" stroke-dasharray="6,4" marker-end="url(#arr)"/><rect x="395.0" y="746.0" width="70.0" height="14" fill="#fff" opacity="0.9"/><text x="430.0" y="757.0" font-family="Arial" font-size="10" text-anchor="middle" fill="#444">Ошибка, id</text><line x1="330" y1="804" x2="130" y2="804" stroke="#333" stroke-width="1.2" stroke-dasharray="6,4" marker-end="url(#arr)"/><rect x="111.8" y="790.0" width="236.4" height="14" fill="#fff" opacity="0.9"/><text x="230.0" y="801.0" font-family="Arial" font-size="10" text-anchor="middle" fill="#444">«Источник недоступен», ввод сохранён</text><rect x="28" y="370" width="784" height="154" rx="0" fill="none" stroke="#888" stroke-width="1.2" stroke-dasharray="6,4"/><rect x="28" y="370" width="34" height="16" rx="0" fill="#EEE" stroke="#888" stroke-width="1.2"/><text x="45.0" y="381.1" font-family="Arial" font-size="9" text-anchor="middle" fill="#111">alt</text><text x="70.0" y="381.5" font-family="Arial" font-size="10" text-anchor="start" fill="#555" font-weight="bold">[ответ B приходит первым]</text><rect x="28" y="528" width="784" height="154" rx="0" fill="none" stroke="#888" stroke-width="1.2" stroke-dasharray="6,4"/><rect x="28" y="528" width="34" height="16" rx="0" fill="#EEE" stroke="#888" stroke-width="1.2"/><text x="45.0" y="539.1" font-family="Arial" font-size="9" text-anchor="middle" fill="#111">alt</text><text x="70.0" y="539.5" font-family="Arial" font-size="10" text-anchor="start" fill="#555" font-weight="bold">[потом приходит ответ A]</text><rect x="28" y="686" width="784" height="154" rx="0" fill="none" stroke="#888" stroke-width="1.2" stroke-dasharray="6,4"/><rect x="28" y="686" width="34" height="16" rx="0" fill="#EEE" stroke="#888" stroke-width="1.2"/><text x="45.0" y="697.1" font-family="Arial" font-size="9" text-anchor="middle" fill="#111">alt</text><text x="70.0" y="697.5" font-family="Arial" font-size="10" text-anchor="start" fill="#555" font-weight="bold">[таймаут или ошибка поставщика]</text><text x="28.0" y="939.0" font-family="Arial" font-size="10" text-anchor="start" fill="#555">Сценарий позднего ответа был пропущен в первой редакции требований; его нашла QA на приёмке. После этого</text><text x="28.0" y="952.0" font-family="Arial" font-size="10" text-anchor="start" fill="#555">добавлены AIR-BR-03 и AIR-UAT-03.</text></svg>